name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK + release bundle (with lint vital)
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-alarm-outputs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-debug.html

      # On main: publish the test APK as a release with a simple download link.
      - name: Prepare test APK
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk TaskAlarm-test.apk

      - name: Publish test release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: "גרסת בדיקה – מעורר משימה"
          prerelease: true
          make_latest: false
          body: |
            גרסת בדיקה להתקנה על הטלפון (לא לגוגל פליי).
            בטלפון: לחצו על TaskAlarm-test.apk למטה, הורידו ופתחו את הקובץ כדי להתקין.
            נבנה מ-commit ${{ github.sha }}
          files: TaskAlarm-test.apk
